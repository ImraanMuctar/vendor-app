<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}Vendor Hub Admin{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --bg: #070b14;                 /* page background */
      --panel: #0b1220;              /* cards/panels */
      --panel2: rgba(255,255,255,.03); /* table rows / subtle blocks */
      --panelHover: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.10);
      --border2: rgba(255,255,255,.14);

      --text: #f8fafc;               /* main text (near-white) */
      --muted: rgba(248,250,252,.65);
      --muted2: rgba(248,250,252,.80);

      --primary: #3b82f6;
      --primaryRing: rgba(59,130,246,.22);

      --danger: #ef4444;
    }

    /* ---------------- HARD DARK MODE LOCK ---------------- */
    html, body { height: 100%; }
    body {
      background: var(--bg) !important;
      color: var(--text) !important;
    }

    /* kill all white-ish defaults */
    .bg-white, .bg-light, .bg-body, .bg-body-tertiary, .bg-body-secondary,
    .dropdown-menu, .modal-content, .offcanvas, .list-group-item,
    .popover, .toast, .card, .table, .table-responsive,
    .btn-light, .btn-outline-dark, .btn-close,
    .form-control, .form-select, .input-group-text {
      background-color: var(--panel) !important;
      color: var(--text) !important;
    }

    /* ---------------- NAV ---------------- */
    .navbar {
      background: rgba(11,18,32,.7) !important;
      border-bottom: 1px solid var(--border) !important;
      backdrop-filter: blur(10px);
    }
    .navbar-brand, .nav-link { color: var(--text) !important; }
    .nav-link { opacity: .78; }
    .nav-link.active { opacity: 1; font-weight: 600; }

    /* ---------------- CARDS / PANELS ---------------- */
    .card {
      border: 1px solid var(--border) !important;
      border-radius: 16px !important;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    /* ---------------- TEXT ---------------- */
    .text-muted { color: var(--muted) !important; }
    h1,h2,h3,h4,h5,h6 { color: var(--text) !important; }

    /* ---------------- LINKS ---------------- */
    a { color: rgba(147,197,253,.95); text-decoration: none; }
    a:hover { color: rgba(191,219,254,.98); text-decoration: underline; }

    /* ---------------- TABLES (no white anywhere) ---------------- */
    .table { margin-bottom: 0; }
    .table thead th {
      color: var(--muted2) !important;
      background: rgba(255,255,255,.02) !important;
      border-bottom: 1px solid var(--border) !important;
    }
    .table td, .table th {
      border-top: 1px solid var(--border) !important;
      color: var(--text) !important;
      background: transparent !important;
    }
    .table tbody tr {
      background: var(--panel2) !important;
    }
    .table tbody tr:hover {
      background: var(--panelHover) !important;
    }
    .table-striped > tbody > tr:nth-of-type(odd) {
      background: rgba(255,255,255,.045) !important;
    }

    /* ---------------- FORMS (visible placeholders) ---------------- */
    .form-label, .form-check-label { color: var(--text) !important; }

    .form-control, .form-select, .input-group-text {
      border: 1px solid var(--border2) !important;
      border-radius: 12px !important;
    }

    .form-control::placeholder {
      color: rgba(248,250,252,.55) !important;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 .25rem var(--primaryRing) !important;
      background: rgba(255,255,255,.04) !important;
      color: var(--text) !important;
    }

    .form-select { color-scheme: dark; }

    /* ---------------- DROPDOWNS ---------------- */
    .dropdown-menu {
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      padding: 8px !important;
    }
    .dropdown-item {
      color: var(--text) !important;
      border-radius: 10px !important;
    }
    .dropdown-item:hover, .dropdown-item:focus {
      background: rgba(255,255,255,.06) !important;
    }
    .dropdown-divider { border-top: 1px solid var(--border) !important; }

    /* ---------------- BUTTONS ---------------- */
    .btn { border-radius: 12px !important; }
    .btn-primary {
      background: var(--primary) !important;
      border-color: rgba(0,0,0,0) !important;
    }
    .btn-primary:hover {
      filter: brightness(1.05);
    }

    .btn-outline-light {
      border-color: rgba(255,255,255,.22) !important;
      color: var(--text) !important;
      background: transparent !important;
    }
    .btn-outline-light:hover {
      background: rgba(255,255,255,.06) !important;
    }

    .btn-danger {
      background: var(--danger) !important;
      border-color: rgba(0,0,0,0) !important;
    }

    /* ---------------- CODE BLOCKS ---------------- */
    code {
      background: rgba(255,255,255,.06) !important;
      color: var(--text) !important;
      padding: 2px 7px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container py-2">
      <a class="navbar-brand fw-semibold" href="/admin/regions">
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e" class="me-2"></span>
        Vendor Hub
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item">
            <a class="nav-link {% if request.path.startswith('/admin/regions') %}active{% endif %}"
               href="/admin/regions">Regions</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path.startswith('/admin/vendors') %}active{% endif %}"
               href="/admin/vendors">Vendors</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
